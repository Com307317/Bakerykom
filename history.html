    <p class="midashi">ひとくち食べれば、誰もが笑顔になれる場所。<br>
    日常に寄り添い、街とともに歩んできたコッペパンの物語。</p>
    <p>昭和の小さな街角で生まれたTamruabakary。<br>
    私たちがずっと大切にしてきたのは、「お腹いっぱい食べて、笑顔になってほしい」というシンプルな想いです。<br>
    ふんわり焼き上げた特製コッペパンに、お好みのクリームや具材をその場で挟むスタイル。<br>
    昔も今も変わらない懐かしい味わいと、時代とともに生まれる新しい組み合わせをお届けしています。</p>
